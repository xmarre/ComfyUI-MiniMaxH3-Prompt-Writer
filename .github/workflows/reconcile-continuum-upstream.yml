name: reconcile Continuum mirror with upstream

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ github.head_ref == 'mirror/continuum-lmstudio-structured-output' && github.repository == 'xmarre/ComfyUI-MiniMaxH3-Prompt-Writer' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out writable mirror branch
        uses: actions/checkout@v4
        with:
          ref: mirror/continuum-lmstudio-structured-output
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "xmarre"
          git config user.email "54859656+xmarre@users.noreply.github.com"

      - name: Reconcile current upstream main
        run: |
          git fetch https://github.com/duckyshell/ComfyUI-MiniMaxH3-Prompt-Writer.git 8b9bb269080dba2213ed08072ab810305e8030a4
          if ! git cherry-pick 8b9bb269080dba2213ed08072ab810305e8030a4; then
            git checkout --ours CHANGELOG.md
            python - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          feature = "- Added **Auto VRAM** support for local External llama.cpp servers, releasing idle ComfyUI workflow models before prompt generation while leaving the external server lifecycle untouched.\n"
          reliability = "- Constrained LM Studio H3 Continuum `plan` and `plan_repair` responses with JSON Schema structured output while retaining Prompt Writer semantic validation, deterministic recovery, and the single bounded repair limit; constrained Qwen planner stages run without reasoning to avoid LM Studio routing schema output into reasoning-only content, and terminal planner failures now include content-free structural response diagnostics.\n"
          feature_marker = "## Unreleased\n\n### Features\n\n"
          reliability_marker = "### Reliability\n\n"
          if feature not in text:
              if feature_marker not in text:
                  raise SystemExit("missing Unreleased Features marker")
              text = text.replace(feature_marker, feature_marker + feature, 1)
          if reliability not in text:
              if reliability_marker not in text:
                  raise SystemExit("missing Reliability marker")
              text = text.replace(reliability_marker, reliability_marker + reliability, 1)
          path.write_text(text, encoding="utf-8")
          PY
            git add CHANGELOG.md
            GIT_EDITOR=true git cherry-pick --continue
          fi

      - name: Ensure reliability note and remove temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          feature = "- Added **Auto VRAM** support for local External llama.cpp servers, releasing idle ComfyUI workflow models before prompt generation while leaving the external server lifecycle untouched.\n"
          reliability = "- Constrained LM Studio H3 Continuum `plan` and `plan_repair` responses with JSON Schema structured output while retaining Prompt Writer semantic validation, deterministic recovery, and the single bounded repair limit; constrained Qwen planner stages run without reasoning to avoid LM Studio routing schema output into reasoning-only content, and terminal planner failures now include content-free structural response diagnostics.\n"
          feature_marker = "## Unreleased\n\n### Features\n\n"
          reliability_marker = "### Reliability\n\n"
          if feature not in text:
              text = text.replace(feature_marker, feature_marker + feature, 1)
          if reliability not in text:
              text = text.replace(reliability_marker, reliability_marker + reliability, 1)
          path.write_text(text, encoding="utf-8")
          PY
          git rm .github/workflows/reconcile-continuum-upstream.yml
          git add CHANGELOG.md
          git commit --amend --no-edit
          git diff-tree --check --no-commit-id -r HEAD
          git push origin HEAD:mirror/continuum-lmstudio-structured-output
