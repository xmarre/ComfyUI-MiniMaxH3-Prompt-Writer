name: apply LM Studio structured reasoning fallback

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'mirror/continuum-lmstudio-structured-output' && github.repository == 'xmarre/ComfyUI-MiniMaxH3-Prompt-Writer' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out writable mirror branch
        uses: actions/checkout@v4
        with:
          ref: mirror/continuum-lmstudio-structured-output
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff aiohttp "av>=17.0.0" pillow

      - name: Apply and validate compatibility fallback
        env:
          PYTHONPATH: tests/ci_stubs
        run: |
          python .github/continuum_lmstudio_reasoning_fallback.py
          python -m ruff check backend tests --select E9,F63,F7,F82
          python -m compileall -q backend tests
          python -m unittest tests.test_continuum_structured_output tests.test_api_provider_backend tests.test_continuum tests.test_continuum_routes
          git diff --check

      - name: Commit normal repository tree
        run: |
          git config user.name "xmarre"
          git config user.email "54859656+xmarre@users.noreply.github.com"
          git rm .github/continuum_lmstudio_reasoning_fallback.py .github/workflows/apply-continuum-lmstudio-reasoning-fallback.yml
          git add -A
          git commit -m "fix: recover LM Studio structured output from reasoning stream"
          git diff-tree --check --no-commit-id -r HEAD
          git push origin HEAD:mirror/continuum-lmstudio-structured-output
