name: apply Continuum structured-output mirror patch

on:
  push:
    branches:
      - mirror/continuum-lmstudio-structured-output

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out mirror branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff aiohttp "av>=17.0.0" pillow

      - name: Apply structured-output patch
        run: python .github/continuum_structured_output_patch.py

      - name: Focused validation
        env:
          PYTHONPATH: tests/ci_stubs
        run: |
          python -m ruff check backend tests --select E9,F63,F7,F82
          python -m compileall -q backend tests
          python -m unittest tests.test_continuum_structured_output tests.test_api_provider_backend tests.test_continuum tests.test_continuum_routes
          git diff --check

      - name: Commit mirror patch
        run: |
          rm .github/continuum_structured_output_patch.py
          rm .github/workflows/apply-continuum-structured-output.yml
          git config user.name "xmarre"
          git config user.email "54859656+xmarre@users.noreply.github.com"
          git add -A
          git commit -m "fix: constrain LM Studio Continuum planner output"

      - name: Reconcile current upstream main
        run: |
          git fetch https://github.com/duckyshell/ComfyUI-MiniMaxH3-Prompt-Writer.git 8b9bb269080dba2213ed08072ab810305e8030a4
          git cherry-pick 8b9bb269080dba2213ed08072ab810305e8030a4

      - name: Push validated mirror tree
        run: git push origin HEAD:mirror/continuum-lmstudio-structured-output
